name: rehovision-convex

services:
  backend:
    image: ghcr.io/get-convex/convex-backend:latest
    container_name: rehovision-convex-backend
    restart: unless-stopped
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "${PORT:-3220}:3210"
      - "${SITE_PROXY_PORT:-3221}:3211"
    volumes:
      - rehovision-convex-data:/convex/data
    environment:
      - CONVEX_CLOUD_ORIGIN=${CONVEX_CLOUD_ORIGIN:-http://127.0.0.1:${PORT:-3220}}
      - CONVEX_SITE_ORIGIN=${CONVEX_SITE_ORIGIN:-http://127.0.0.1:${SITE_PROXY_PORT:-3221}}
      - RUST_LOG=${RUST_LOG:-info}
      - POSTGRES_URL=${POSTGRES_URL:-}
      - DO_NOT_REQUIRE_SSL=${DO_NOT_REQUIRE_SSL:-}
    healthcheck:
      test: curl -f http://localhost:3210/version || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  dashboard:
    image: ghcr.io/get-convex/convex-dashboard:latest
    container_name: rehovision-convex-dashboard
    restart: unless-stopped
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "${DASHBOARD_PORT:-6792}:6791"
    environment:
      - NEXT_PUBLIC_DEPLOYMENT_URL=${NEXT_PUBLIC_DEPLOYMENT_URL:-http://127.0.0.1:${PORT:-3220}}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  rehovision-convex-data:
    driver: local
